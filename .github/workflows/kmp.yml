name: kmp

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - kmp/**
      - .swift-format
      - .xcode-version
      - scripts/swift-format.sh
      - .github/workflows/kmp.yml

# A new push supersedes the previous run.
concurrency:
  group: kmp-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      # The action's default package list still names `tools`, which the SDK
      # no longer has. AGP fetches the platform it compiles against itself.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      # Both projects commit a gradle-wrapper.jar. This checks them against the
      # checksums Gradle publishes, so a tampered wrapper cannot run here.
      - name: Validate the Gradle wrappers
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Caches ~/.gradle and the configuration cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # commonTest on the JVM, then the Android library into
      # kmp/android-host/local-repo, which the host app resolves it from.
      - name: Test and publish the library
        working-directory: kmp/shared
        run: ./gradlew testAndroidHostTest publishToHostApp

      - name: Test the host app
        working-directory: kmp/android-host
        run: ./gradlew testDebugUnitTest

      # The configuration the benchmark measures, with R8 enabled.
      - name: Build for release
        working-directory: kmp/android-host
        run: ./gradlew assembleRelease

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # xcodes ships on the runner image, so the Xcode versions it already
      # holds can be selected without a third-party action.
      - name: Select Xcode
        run: |
          sudo xcodes select "$(cat .xcode-version)"
          xcodebuild -version

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The Kotlin/Native toolchain and its prebuilt platform libraries,
      # downloaded on the first build. Keyed on the build script, which pins
      # the Kotlin version.
      - name: Cache Kotlin/Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('kmp/shared/build.gradle.kts') }}

      - name: Lint Swift
        run: ./scripts/swift-format.sh

      # commonTest on the iOS simulator, then the framework the host links.
      - name: Test and build the XCFramework
        working-directory: kmp/shared
        run: ./gradlew iosSimulatorArm64Test assembleRepoSearchKitReleaseXCFramework

      - name: Generate the host app project
        working-directory: kmp/ios-host
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Test the host app
        working-directory: kmp/ios-host
        run: |
          set -o pipefail
          xcodebuild test \
            -project HostApp.xcodeproj \
            -scheme HostApp \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # The configuration the benchmark measures.
      - name: Build for release
        working-directory: kmp/ios-host
        run: |
          set -o pipefail
          xcodebuild build \
            -project HostApp.xcodeproj \
            -scheme HostApp \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
