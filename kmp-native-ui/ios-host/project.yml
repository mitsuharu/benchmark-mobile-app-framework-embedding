name: HostApp
options:
  bundleIdPrefix: com.example.benchmark.kmp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.4"

targets:
  HostApp:
    type: application
    platform: iOS
    sources:
      - path: HostApp
    info:
      path: HostApp/Info.plist
      properties:
        CFBundleDisplayName: KMP+UI Host
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Lets the benchmark build reach bench/mock-server over plain http on
        # the loopback address. Remote hosts still require https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        # A physical device reaches bench/mock-server over the LAN, which iOS
        # asks the user to allow once.
        NSLocalNetworkUsageDescription: ベンチマーク用のモックサーバーに接続します。
        # Empty means the real GitHub API; see AppConfig.swift.
        BenchAPIBaseURL: $(BENCH_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.benchmark.kmpnativeui.host
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # The XCFramework only carries the Apple silicon simulator slice
        # (iosSimulatorArm64), so a Release build for the simulator must not
        # ask for x86_64 as well.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # Overridden on the xcodebuild command line by the benchmark build,
        # e.g. BENCH_API_BASE_URL=http://127.0.0.1:8787
        BENCH_API_BASE_URL: ""
    dependencies:
      # The shared Kotlin logic (no UI), produced by
      # `./gradlew assembleRepoSearchKit<Release|Debug>XCFramework`
      # in ../shared; scripts/generate.sh picks the build type. The framework
      # is static, so it is linked, not embedded.
      - framework: ../shared/build/XCFrameworks/${KMP_FRAMEWORK_BUILD}/RepoSearchKit.xcframework
        embed: false
    scheme:
      testTargets:
        - HostAppTests

  HostAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HostAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.benchmark.kmpnativeui.host.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HostApp
