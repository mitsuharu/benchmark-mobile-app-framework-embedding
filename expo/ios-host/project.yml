name: HostApp
options:
  bundleIdPrefix: com.example.sample.expo.brownfield
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.4"

packages:
  # Produced by `npm run brownfield:ios` in ../expo-app.
  # The `-release` suffix comes from expo-brownfield: precompiled builds emit
  # one Swift Package per build configuration.
  RepoSearchKitPackage:
    path: ../expo-app/artifacts/RepoSearchKitPackage-release

targets:
  HostApp:
    type: application
    platform: iOS
    sources:
      - path: HostApp
    info:
      path: HostApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required so the debug flavor can reach the Metro bundler over http://localhost:8081.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Allows the React Native screen to connect to the Metro bundler during development.
        # Handed to the React Native screen as `apiBaseUrl`. Empty means the
        # real GitHub API; see AppConfig.swift.
        BenchAPIBaseURL: $(BENCH_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sample.expo.brownfield.host
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Overridden on the xcodebuild command line by the benchmark build,
        # e.g. BENCH_API_BASE_URL=http://127.0.0.1:8787 (NSAllowsLocalNetworking
        # above already lets it through).
        BENCH_API_BASE_URL: ""
    dependencies:
      - package: RepoSearchKitPackage
        product: RepoSearchKitPackage-release
    scheme:
      testTargets:
        - HostAppTests

  HostAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HostAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sample.expo.brownfield.host.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HostApp
